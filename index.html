<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexus Trident Agency</title>

<style>
:root{
  --bg:#eef2f5;
  --card:#fff;
  --tx:#17243a;
  --mute:#68768a;
  --bd:#dce4ee;
  --ac:#17365d;
  --acx:#fff;
}

/* Force the app to stay in light mode regardless of system preference */
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#eef2f5;
    --card:#fff;
    --tx:#17243a;
    --mute:#68768a;
    --bd:#dce4ee;
    --ac:#17365d;
    --acx:#fff;
  }
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--tx);
  font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif
}

.wrap{
  max-width:760px;
  margin:0 auto;
  padding:16px
}

h1{
  font-size:20px;
  margin:4px 0 12px
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:12px
}

.tab{
  flex:1;
  padding:10px;
  border:1px solid var(--bd);
  background:var(--card);
  color:var(--tx);
  border-radius:10px;
  font-size:15px;
  font-weight:600;
  cursor:pointer
}

.tab.on{
  background:var(--ac);
  color:var(--acx);
  border-color:var(--ac)
}

.tab small{
  opacity:.8;
  font-weight:400
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

input,select,textarea{
  font:inherit;
  color:var(--tx);
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:8px;
  padding:9px;
  min-width:0
}

.add{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:12px;
  padding:12px;
  margin-bottom:12px
}

.add input{
  flex:1 1 130px
}

button.p{
  background:var(--ac);
  color:var(--acx);
  border:0;
  border-radius:8px;
  padding:9px 14px;
  font-weight:600;
  cursor:pointer
}

button:disabled{
  opacity:.55;
  cursor:not-allowed
}

.filters{
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin-bottom:10px;
  padding-bottom:2px
}

.chip{
  white-space:nowrap;
  padding:5px 10px;
  border:1px solid var(--bd);
  border-radius:999px;
  background:var(--card);
  color:var(--mute);
  cursor:pointer;
  font-size:13px
}

.chip.on{
  background:var(--tx);
  color:var(--bg);
  border-color:var(--tx)
}

.lead{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:12px;
  padding:12px;
  margin-bottom:8px
}

.top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center
}

.nm{
  font-weight:600;
  font-size:16px
}

.ct{
  color:var(--mute);
  font-size:13px;
  word-break:break-all
}

.lead textarea{
  width:100%;
  margin-top:8px;
  min-height:40px;
  resize:vertical
}

.acts{
  display:flex;
  gap:10px;
  margin-top:6px;
  font-size:12px;
  color:var(--mute);
  flex-wrap:wrap
}

.acts button{
  background:none;
  border:0;
  color:var(--mute);
  cursor:pointer;
  padding:2px 0;
  text-decoration:underline;
  font-size:12px
}

.goalcard{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:14px;
  padding:14px;
  margin:0 0 12px;
  box-shadow:0 4px 14px rgba(0,0,0,.04)
}

.goalhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.goaltitle{
  font-size:10px;
  font-weight:800;
  letter-spacing:.14em;
  color:var(--mute)
}

.goalnumber{
  font-size:20px;
  font-weight:800;
  margin-top:2px
}

.goalbadge{
  font-size:10px;
  font-weight:800;
  letter-spacing:.08em;
  border:1px solid var(--bd);
  border-radius:999px;
  padding:6px 9px
}

.goaltrack{
  height:10px;
  background:var(--bg);
  border-radius:99px;
  overflow:hidden;
  margin-top:11px
}

.goaltrack i{
  display:block;
  height:100%;
  width:0;
  border-radius:99px;
  background:linear-gradient(90deg,#2563eb,#7c3aed,#db2777);
  transition:width .7s cubic-bezier(.2,.8,.2,1)
}

.goalbottom{
  display:flex;
  justify-content:space-between;
  margin-top:6px;
  font-size:11px;
  color:var(--mute)
}

.bpflash{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  background:radial-gradient(circle at center,rgba(250,204,21,.22),transparent 45%);
  animation:flash .7s ease-out forwards
}

@keyframes flash{
  0%{opacity:0}
  20%{opacity:1}
  100%{opacity:0}
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:12px
}

.stat{
  background:var(--card);
  border:1px solid var(--bd);
  border-radius:10px;
  padding:8px;
  text-align:center
}

.stat b{
  display:block;
  font-size:18px
}

.stat span{
  font-size:11px;
  color:var(--mute)
}

.tgs{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:8px
}

.tg{
  padding:4px 10px;
  border:1px solid var(--bd);
  border-radius:999px;
  background:var(--card);
  color:var(--mute);
  font-size:12px;
  cursor:pointer
}

.tg.on{
  background:var(--ac);
  color:var(--acx);
  border-color:var(--ac)
}

.tg.bad.on{
  background:#dc2626;
  border-color:#dc2626;
  color:#fff
}

@media(max-width:480px){
  .stats{
    grid-template-columns:repeat(2,1fr)
  }
}

.drop{
  border:2px dashed var(--bd);
  border-radius:10px;
  padding:14px;
  text-align:center;
  color:var(--mute);
  margin-top:10px;
  cursor:pointer;
  font-size:13px
}

.drop.over{
  border-color:var(--ac);
  color:var(--ac)
}

.board{
  border-radius:16px;
  padding:14px;
  margin-bottom:14px;
  color:#fff;
  background:linear-gradient(135deg,#1e3a8a,#7c3aed 60%,#db2777);
  box-shadow:0 6px 20px rgba(76,29,149,.25)
}

.board h2{
  font-size:12px;
  margin:0 0 10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.12em;
  opacity:.9;
  text-align:center
}

.br{
  position:relative;
  display:grid;
  grid-template-columns:34px 1fr auto;
  gap:10px;
  align-items:center;
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,.12);
  margin-bottom:8px
}

.br.lead1{
  background:linear-gradient(135deg,rgba(253,224,71,.38),rgba(251,191,36,.22));
  box-shadow:0 0 0 2px rgba(253,224,71,.85),0 0 18px rgba(253,224,71,.35)
}

.rk{
  font-size:26px;
  text-align:center;
  line-height:1
}

.bn{
  font-weight:700;
  font-size:17px
}

.bn small{
  display:block;
  font-weight:500;
  font-size:12px;
  opacity:.85;
  margin-top:1px
}

.bar{
  height:7px;
  border-radius:99px;
  background:rgba(255,255,255,.2);
  margin-top:6px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  border-radius:99px;
  background:#fde047;
  transition:width .6s ease
}

.bv{
  font-size:34px;
  font-weight:800;
  line-height:1;
  text-align:right
}

.bv small{
  display:block;
  font-size:10px;
  font-weight:600;
  letter-spacing:.08em;
  opacity:.8;
  text-transform:uppercase;
  margin-top:2px
}

.tie{
  text-align:center;
  font-size:13px;
  font-weight:700;
  margin-top:2px
}

.empty,.msg{
  text-align:center;
  color:var(--mute);
  padding:28px 8px
}

.moveflash{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(20px);
  background:#111827;
  color:#fff;
  padding:11px 18px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  z-index:10001;
  opacity:0;
  transition:.25s ease;
  pointer-events:none;
}

.moveflash.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
/* ===== NEXUS TRIDENT PROFESSIONAL DESIGN ===== */

:root {
  --bg: #eef2f7;
  --card: #ffffff;
  --tx: #17243a;
  --mute: #68768a;
  --bd: #dce4ee;
  --ac: #17365d;
  --acx: #ffffff;
}

body {
  background: linear-gradient(145deg, #f5f7fb 0%, #e8eef6 100%);
  color: var(--tx);
}

.wrap {
  max-width: 800px;
  padding: 20px 16px 30px;
}

h1 {
  color: #142b49;
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.6px;
  padding: 5px 0 12px;
  border-bottom: 2px solid #d9e2ee;
}

.tab {
  transition: background .2s, border-color .2s, transform .2s;
}

.tab.on {
  background: linear-gradient(135deg, #17365d, #285786);
  border-color: #17365d;
  box-shadow: 0 3px 9px rgba(23, 54, 93, .18);
}

button.p {
  background: linear-gradient(135deg, #17365d, #285786);
  box-shadow: 0 2px 5px rgba(23, 54, 93, .12);
  transition: transform .15s, box-shadow .15s;
}

button.p:hover {
  box-shadow: 0 4px 10px rgba(23, 54, 93, .22);
  transform: translateY(-1px);
}

input:focus,
select:focus,
textarea:focus {
  outline: 2px solid rgba(40, 87, 134, .18);
  border-color: #285786;
}

.add,
.goalcard,
.stat,
.lead {
  background: #ffffff;
  border: 1px solid #dce4ee;
  box-shadow: 0 3px 12px rgba(22, 42, 69, .045);
}

.add {
  border-radius: 14px;
  padding: 14px;
}

.lead {
  border-radius: 13px;
  padding: 14px;
  transition: box-shadow .2s, border-color .2s;
}

.lead:hover {
  border-color: #c4d2e3;
  box-shadow: 0 5px 16px rgba(22, 42, 69, .075);
}

.stat {
  border-radius: 12px;
  padding: 12px 8px;
}

.stat b {
  color: #17365d;
  font-size: 20px;
}

.stat span {
  color: #68768a;
}

.chip {
  transition: all .18s ease;
}

.chip.on {
  background: #17365d;
  border-color: #17365d;
  color: #ffffff;
}

.tg.on {
  background: #17365d;
  border-color: #17365d;
  color: #ffffff;
}

.tg.bad.on {
  background: #b42332;
  border-color: #b42332;
}

.goalcard {
  border-radius: 15px;
  padding: 16px;
}

.goaltitle {
  color: #68768a;
}

.goalnumber {
  color: #17365d;
  font-size: 23px;
}

.goalbadge {
  color: #17365d;
  background: #edf3fa;
  border-color: #d5e1ef;
}

.goaltrack {
  background: #e8edf4;
}

.goaltrack i {
  background: linear-gradient(90deg, #17365d, #3879b9, #d7aa43);
}

/* Navy and gold leaderboard */

.board {
  position: relative;
  overflow: hidden;
  padding: 19px;
  border: 1px solid #29496f;
  border-radius: 17px;
  background: linear-gradient(140deg, #10243e 0%, #17365d 58%, #244b76 100%);
  box-shadow: 0 9px 24px rgba(16, 36, 62, .18);
}

.board::before {
  content: "";
  position: absolute;
  top: -65px;
  right: -50px;
  width: 180px;
  height: 180px;
  border: 1px solid rgba(225, 190, 103, .18);
  border-radius: 50%;
  pointer-events: none;
}

.board h2 {
  position: relative;
  z-index: 1;
  color: #f4d78c;
  font-size: 12px;
  letter-spacing: .16em;
  opacity: 1;
  margin-bottom: 15px;
}

.br {
  position: relative;
  z-index: 1;
  grid-template-columns: 38px minmax(0, 1fr) 54px;
  gap: 12px;
  padding: 13px;
  border: 1px solid rgba(255, 255, 255, .09);
  border-radius: 12px;
  background: rgba(255, 255, 255, .075);
  margin-bottom: 9px;
}

.br.lead1 {
  background: linear-gradient(
    115deg,
    rgba(215, 170, 67, .23),
    rgba(255, 255, 255, .09)
  );
  border: 1px solid rgba(238, 202, 117, .9);
  box-shadow: 0 0 0 1px rgba(215, 170, 67, .15);
}

.rk {
  font-size: 25px;
}

.bn {
  color: #ffffff;
  font-size: 16px;
  overflow-wrap: anywhere;
}

.bn small {
  color: #d4deea;
  font-size: 11px;
}

.br.lead1 .bn small {
  color: #f4d78c;
}

.bar {
  height: 6px;
  background: rgba(255, 255, 255, .16);
}

.bar i {
  background: linear-gradient(90deg, #c79b39, #f3d58a);
}

.bv {
  color: #ffffff;
  font-size: 32px;
  font-variant-numeric: tabular-nums;
}

.br.lead1 .bv {
  color: #f4d78c;
}

.bv small {
  color: #d4deea;
  font-size: 9px;
}

.tie {
  color: #f4d78c;
}

#momentum {
  position: relative;
  z-index: 1;
  color: #d4deea;
  line-height: 1.5;
}

/* Buttons and status controls */

.acts button:hover {
  color: #17365d;
}

.drop {
  background: #f8fafd;
  border-color: #bdccde;
  border-radius: 12px;
}

.drop.over {
  background: #edf4fb;
  border-color: #285786;
  color: #17365d;
}

.empty,
.msg {
  color: #68768a;
}

.moveflash {
  background: #17365d;
  box-shadow: 0 5px 18px rgba(16, 36, 62, .2);
}

@media (max-width: 480px) {
  .wrap {
    padding: 14px 11px 24px;
  }

  h1 {
    font-size: 21px;
  }

  .board {
    padding: 14px;
  }

  .br {
    grid-template-columns: 30px minmax(0, 1fr) 44px;
    gap: 8px;
    padding: 10px;
  }

  .bn {
    font-size: 15px;
  }

  .bv {
    font-size: 27px;
  }

  .add input {
    flex: 1 1 140px;
  }
}
</style>
</head>

<div class="wrap">

<h1>Nexus Trident Agency</h1>

<div class="board">
  <h2>🏆 New BP Leaderboard</h2>
  <div id="board"></div>
  <div id="momentum" style="text-align:center;font-size:11px;font-weight:700;opacity:.85;margin-top:7px"></div>
</div>

<div class="goalcard">

  <div class="goalhead">

    <div>
      <div class="goaltitle">TEAM BP GOAL</div>

      <div class="goalnumber">
        <span id="goalcount">0</span> / 10 New BPs
      </div>
    </div>

    <div class="goalbadge" id="goalbadge">
      LET'S GO
    </div>

  </div>

  <div class="goaltrack">
    <i id="goalfill"></i>
  </div>

  <div class="goalbottom">
    <span id="goaltext">0% complete</span>
    <span id="goalremaining">10 to goal</span>
  </div>

</div>

<div class="tabs" id="tabs"></div>

<div class="add">

  <div class="row">

    <input id="fn" placeholder="First name">

    <input id="ln" placeholder="Last name">

    <input id="em" type="email" placeholder="Email">

    <input id="ph" type="tel" placeholder="Phone">

    <select id="pf">
      <option value="">Platform…</option>
      <option>LinkedIn</option>
      <option>ZipRecruiter</option>
      <option>Indeed</option>
      <option>Other</option>
    </select>

    <button class="p" id="addb">
      Add lead
    </button>

  </div>

</div>

<div class="add" id="poolbox" style="display:none">

  <div style="font-weight:600;margin-bottom:6px">
    Drop leads in the pool
  </div>

  <textarea

  <div class="drop" id="drop">

  </div>

  <div
    class="row"

  >

    <select id="bpf">

      <option value="">
        Platform for all…
      </option>

      <option>LinkedIn</option>
      <option>ZipRecruiter</option>
      <option>Indeed</option>
      <option>Other</option>

    </select>

    <button class="p" id="bulkb">
      Add to pool
    </button>

    <button class="p" id="splitb">
      Split evenly: Logan / Leo
    </button>

    <span class="ct" id="splitmsg"></span>

  </div>

</div>

<div
  id="note"
  class="ct"
  style="min-height:18px;margin:-4px 0 8px"
></div>

<div class="stats" id="stats"></div>

<div class="filters" id="filters"></div>

<div id="list">
  <div class="msg">
    Loading…
  </div>
</div>

<div style="text-align:center;margin:18px 0">

  <button class="chip" id="expb">
    Export all leads (CSV for Google Sheets)
  </button>

</div>

</div>

<div id="moveflash" class="moveflash"></div>
