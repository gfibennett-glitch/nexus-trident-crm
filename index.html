<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexus Trident Agency</title>

<style>
:root{
  --bg:#f4f7fb;
  --bg-2:#eef3ff;
  --panel:rgba(255,255,255,.74);
  --panel-strong:#ffffff;
  --tx:#111827;
  --mute:#60708a;
  --bd:rgba(148,163,184,.28);
  --ac:#4f46e5;
  --ac-2:#7c3aed;
  --ac-3:#ec4899;
  --acx:#fff;
  --success:#10b981;
  --shadow:0 18px 40px rgba(79,70,229,.16);
}

@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#090d16;
    --bg-2:#121a2f;
    --panel:rgba(18,24,37,.78);
    --panel-strong:#151b27;
    --tx:#edf2ff;
    --mute:#a1acc3;
    --bd:rgba(110,122,149,.35);
    --ac:#7c9cff;
    --ac-2:#a78bfa;
    --ac-3:#f472b6;
    --acx:#0b1220;
    --success:#34d399;
    --shadow:0 18px 40px rgba(17,24,39,.5);
  }
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(79,70,229,.18), transparent 38%),
    radial-gradient(circle at bottom right, rgba(236,72,153,.16), transparent 35%),
    linear-gradient(180deg,var(--bg-2),var(--bg));
  color:var(--tx);
  font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif
}

.wrap{
  max-width:860px;
  margin:0 auto;
  padding:28px 16px 40px
}

h1{
  font-size:28px;
  margin:0 0 18px;
  letter-spacing:-.04em;
  color:var(--tx);
}

.tabs{
  display:flex;
  gap:10px;
  margin-bottom:16px;
  padding:6px;
  border-radius:18px;
  background:rgba(255,255,255,.28);
  border:1px solid var(--bd);
  backdrop-filter:blur(10px);
  box-shadow:var(--shadow);
}

.tab{
  flex:1;
  padding:12px 10px;
  border:1px solid transparent;
  background:transparent;
  color:var(--mute);
  border-radius:12px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.2s ease;
}

.tab.on{
  background:linear-gradient(135deg,var(--ac),var(--ac-2));
  color:var(--acx);
  border-color:rgba(255,255,255,.12);
  box-shadow:0 10px 18px rgba(99,102,241,.28);
}

.tab small{
  opacity:.8;
  font-weight:500
}

.row{
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

input,select,textarea{
  font:inherit;
  color:var(--tx);
  background:rgba(255,255,255,.42);
  border:1px solid var(--bd);
  border-radius:12px;
  padding:11px 12px;
  min-width:0;
  transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
}

input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:rgba(79,70,229,.55);
  box-shadow:0 0 0 4px rgba(79,70,229,.12);
  background:var(--panel-strong);
}

.add{
  background:var(--panel);
  border:1px solid var(--bd);
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  backdrop-filter:blur(12px);
  box-shadow:var(--shadow);
}

.add input{
  flex:1 1 140px
}

button.p{
  background:linear-gradient(135deg,var(--ac),var(--ac-2));
  color:var(--acx);
  border:0;
  border-radius:12px;
  padding:11px 16px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 12px 18px rgba(99,102,241,.22);
  transition:transform .15s ease, box-shadow .2s ease;
}

button.p:hover{transform:translateY(-1px)}
button:disabled{opacity:.55;cursor:not-allowed}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:12px;
  padding-bottom:4px
}

.chip{
  white-space:nowrap;
  padding:7px 12px;
  border:1px solid var(--bd);
  border-radius:999px;
  background:var(--panel);
  color:var(--mute);
  cursor:pointer;
  font-size:13px;
  font-weight:600;
  transition:.2s ease;
}

.chip.on{
  background:linear-gradient(135deg,var(--tx),#374151);
  color:var(--bg);
  border-color:transparent;
}

.lead{
  background:var(--panel);
  border:1px solid var(--bd);
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
  box-shadow:0 12px 24px rgba(15,23,42,.04);
  backdrop-filter:blur(10px);
}

.top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center
}

.nm{
  font-weight:700;
  font-size:17px
}

.ct{
  color:var(--mute);
  font-size:13px;
  word-break:break-all
}

.lead textarea{
  width:100%;
  margin-top:8px;
  min-height:42px;
  resize:vertical
}

.acts{
  display:flex;
  gap:10px;
  margin-top:8px;
  font-size:12px;
  color:var(--mute);
  flex-wrap:wrap
}

.acts button{
  background:none;
  border:0;
  color:var(--mute);
  cursor:pointer;
  padding:2px 0;
  text-decoration:underline;
  font-size:12px
}

.goalcard{
  background:linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,255,255,.7));
  border:1px solid var(--bd);
  border-radius:22px;
  padding:18px 18px 16px;
  margin:0 0 14px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
}

.goalhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px
}

.goaltitle{
  font-size:10px;
  font-weight:800;
  letter-spacing:.18em;
  color:var(--mute);
  text-transform:uppercase
}

.goalnumber{
  font-size:26px;
  font-weight:800;
  margin-top:4px;
  letter-spacing:-.04em
}

.goalbadge{
  font-size:10px;
  font-weight:800;
  letter-spacing:.08em;
  border:1px solid var(--bd);
  border-radius:999px;
  padding:7px 10px;
  background:rgba(255,255,255,.4);
  text-transform:uppercase;
}

.goaltrack{
  height:12px;
  background:rgba(15,23,42,.06);
  border-radius:999px;
  overflow:hidden;
  margin-top:14px;
  border:1px solid rgba(148,163,184,.14);
}

.goaltrack i{
  display:block;
  height:100%;
  width:0;
  border-radius:999px;
  background:linear-gradient(90deg,var(--ac),var(--ac-2),var(--ac-3));
  box-shadow:0 0 20px rgba(99,102,241,.28);
  transition:width .7s cubic-bezier(.2,.8,.2,1)
}

.goalbottom{
  display:flex;
  justify-content:space-between;
  margin-top:8px;
  font-size:11px;
  color:var(--mute);
  font-weight:700
}

.bpflash{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  background:radial-gradient(circle at center,rgba(250,204,21,.22),transparent 45%);
  animation:flash .7s ease-out forwards
}

@keyframes flash{
  0%{opacity:0}
  20%{opacity:1}
  100%{opacity:0}
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:14px
}

.stat{
  background:var(--panel);
  border:1px solid var(--bd);
  border-radius:16px;
  padding:12px 8px;
  text-align:center;
  box-shadow:0 10px 24px rgba(15,23,42,.04);
}

.stat b{
  display:block;
  font-size:20px;
  letter-spacing:-.05em;
}

.stat span{
  font-size:11px;
  color:var(--mute);
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase
}

.tgs{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:10px
}

.tg{
  padding:5px 10px;
  border:1px solid var(--bd);
  border-radius:999px;
  background:var(--panel);
  color:var(--mute);
  font-size:12px;
  cursor:pointer;
  font-weight:600;
}

.tg.on{
  background:linear-gradient(135deg,var(--ac),var(--ac-2));
  color:var(--acx);
  border-color:transparent;
}

.tg.bad.on{
  background:linear-gradient(135deg,#ef4444,#dc2626);
  border-color:transparent;
  color:#fff
}

@media(max-width:480px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .goalhead{align-items:flex-start;flex-direction:column}
}

.drop{
  border:2px dashed var(--bd);
  border-radius:14px;
  padding:16px;
  text-align:center;
  color:var(--mute);
  margin-top:12px;
  cursor:pointer;
  font-size:13px;
  background:rgba(148,163,184,.04);
}

.drop.over{
  border-color:rgba(79,70,229,.7);
  color:var(--ac);
  background:rgba(79,70,229,.06)
}

.board{
  border-radius:22px;
  padding:16px 14px 12px;
  margin-bottom:16px;
  color:#fff;
  background:linear-gradient(135deg,#111827 0%,#1d4ed8 26%,#7c3aed 62%,#db2777 100%);
  box-shadow:0 16px 32px rgba(76,29,149,.26);
  border:1px solid rgba(255,255,255,.14);
}

.board h2{
  font-size:11px;
  margin:0 0 12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.18em;
  opacity:.9;
  text-align:center
}

.br{
  position:relative;
  display:grid;
  grid-template-columns:36px 1fr auto;
  gap:12px;
  align-items:center;
  padding:11px 12px;
  border-radius:14px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.08);
  margin-bottom:8px;
  backdrop-filter:blur(4px);
}

.br.lead1{
  background:linear-gradient(135deg,rgba(253,224,71,.35),rgba(251,191,36,.18));
  box-shadow:0 0 0 2px rgba(253,224,71,.7),0 0 18px rgba(253,224,71,.18)
}

.rk{
  font-size:24px;
  text-align:center;
  line-height:1
}

.bn{
  font-weight:700;
  font-size:17px;
  line-height:1.2
}

.bn small{
  display:block;
  font-weight:500;
  font-size:12px;
  opacity:.85;
  margin-top:4px
}

.bar{
  height:8px;
  border-radius:99px;
  background:rgba(255,255,255,.18);
  margin-top:7px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  border-radius:99px;
  background:linear-gradient(90deg,#fef3c7,#fde68a,#facc15);
  transition:width .6s ease
}

.bv{
  font-size:34px;
  font-weight:800;
  line-height:1;
  text-align:right
}

.bv small{
  display:block;
  font-size:10px;
  font-weight:700;
  letter-spacing:.09em;
  opacity:.8;
  text-transform:uppercase;
  margin-top:3px
}

.tie{
  text-align:center;
  font-size:13px;
  font-weight:700;
  margin-top:2px
}

.empty,.msg{
  text-align:center;
  color:var(--mute);
  padding:28px 8px
}

.moveflash{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(20px);
  background:rgba(17,24,39,.94);
  color:#fff;
  padding:11px 18px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  z-index:10001;
  opacity:0;
  transition:.25s ease;
  pointer-events:none;
  box-shadow:0 12px 24px rgba(15,23,42,.2);
}

.moveflash.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="wrap">

<h1>Nexus Trident Agency</h1>

<div class="board">
  <h2>🏆 New BP Leaderboard</h2>
  <div id="board"></div>
  <div id="momentum" style="text-align:center;font-size:11px;font-weight:700;opacity:.85;margin-top:7px"></div>
</div>

<div class="goalcard">

  <div class="goalhead">

    <div>
      <div class="goaltitle">TEAM BP GOAL</div>

      <div class="goalnumber">
        <span id="goalcount">0</span> / 10 New BPs
      </div>
    </div>

    <div class="goalbadge" id="goalbadge">
      LET'S GO
    </div>

  </div>

  <div class="goaltrack">
    <i id="goalfill"></i>
  </div>

  <div class="goalbottom">
    <span id="goaltext">0% complete</span>
    <span id="goalremaining">10 to goal</span>
  </div>

</div>

<div class="tabs" id="tabs"></div>

<div class="add">

  <div class="row">

    <input id="fn" placeholder="First name">

    <input id="ln" placeholder="Last name">

    <input id="em" type="email" placeholder="Email">

    <input id="ph" type="tel" placeholder="Phone">

    <select id="pf">
      <option value="">Platform…</option>
      <option>LinkedIn</option>
      <option>ZipRecruiter</option>
      <option>Indeed</option>
      <option>Other</option>
    </select>

    <button class="p" id="addb">
      Add lead
    </button>

  </div>

</div>

<div class="add" id="poolbox" style="display:none">

  <div style="font-weight:600;margin-bottom:6px">
    Drop leads in the pool
  </div>

  <textarea
    id="bulk"
    rows="4"
    style="width:100%"
    placeholder="Paste one lead per line: First Last, email, phone">
  </textarea>

  <div class="drop" id="drop">

    Or drop an applicant CSV here
    (Indeed, ZipRecruiter, LinkedIn)
    or tap to choose a file.

    <input
      type="file"
      id="file"
      accept=".csv,text/csv"
      hidden
    >

  </div>

  <div
    class="row"
    style="margin-top:8px;align-items:center"
  >

    <select id="bpf">

      <option value="">
        Platform for all…
      </option>

      <option>LinkedIn</option>
      <option>ZipRecruiter</option>
      <option>Indeed</option>
      <option>Other</option>

    </select>

    <button class="p" id="bulkb">
      Add to pool
    </button>

    <button class="p" id="splitb">
      Split evenly: Logan / Leo
    </button>

    <span class="ct" id="splitmsg"></span>

  </div>

</div>

<div
  id="note"
  class="ct"
  style="min-height:18px;margin:-4px 0 8px"
></div>

<div class="stats" id="stats"></div>

<div class="filters" id="filters"></div>

<div id="list">
  <div class="msg">
    Loading…
  </div>
</div>

<div style="text-align:center;margin:18px 0">

  <button class="chip" id="expb">
    Export all leads (CSV for Google Sheets)
  </button>

</div>

</div>

<div id="moveflash" class="moveflash"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://dnrtxgghajgaitoacdya.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_3dm11FqJHrw7qBrglXlOcw_QyBX737O";

const TABS = ["Logan","Pool","Leo"];
const OWNERS = ["Logan","Leo"];
const STATUSES = ["New","Contacted","Interview","Offer","Hired","Passed","No Show"];

let tab = "Pool";
let filter = "All";
let leads = [];
let db = false;
let sb = null;
let loading = false;

const $ = id => document.getElementById(id);

try{tab = localStorage.getItem("tab") || "Pool";}catch(e){}

function note(message,bad=false){
  const n = $("note");
  n.textContent = message;
  n.style.color = bad ? "#dc2626" : "var(--mute)";
  clearTimeout(note.t);
  if(!bad){
    note.t = setTimeout(()=>{n.textContent="";},3500);
  }
}

function showMove(message){
  const box = $("moveflash");
  box.textContent = message;
  box.classList.add("show");
  clearTimeout(showMove.t);
  showMove.t = setTimeout(()=>{box.classList.remove("show");},1800);
}

function fail(e){
  console.error("Supabase error:",e);
  const code = e?.code || "";
  const msg = e?.message || "";
  note("Couldn't save" + (code || msg ? ": " + (code || msg) : ""), true);
}

function isBP(lead){return lead?.status === "Hired";}

function ownerLeads(owner){
  if(owner === "Pool"){return leads.filter(l => l.owner === "Pool");}
  return leads.filter(l => l.owner === owner);
}

function renderGoal(){
  const total = leads.filter(isBP).length;
  const goal = 10;
  const pct = Math.min(100, Math.round(total / goal * 100));
  $("goalcount").textContent = total;
  $("goalfill").style.width = pct + "%";
  $("goaltext").textContent = pct + "% complete";
  $("goalremaining").textContent = total >= goal ? "GOAL REACHED" : Math.max(0,goal-total) + " to goal";
  $("goalbadge").textContent = total >= goal ? "GOAL REACHED" : total === 0 ? "LET'S GO" : total >= 7 ? "ON FIRE" : "IN PROGRESS";
}

function render(){
  renderGoal();
  renderBoard();
  renderTabs();
  renderStats();
  renderFilters();
  renderLeads();
}

function renderBoard(){
  const rows = OWNERS.map(owner => ({owner, bp: leads.filter(l => l.owner === owner && isBP(l)).length}));
  const top = Math.max(...rows.map(x=>x.bp),0);
  const tied = rows.length > 1 && rows[0].bp === rows[1].bp;
  const board = $("board");
  board.innerHTML = "";
  const totalBP = rows.reduce((sum,x)=>sum+x.bp,0);
  const momentum = $("momentum");

  if(totalBP === 0){
    momentum.textContent = "Your first New BP starts the race.";
  }else if(totalBP < 5){
    momentum.textContent = "Good start. Keep the pipeline moving.";
  }else if(totalBP < 10){
    momentum.textContent = "🔥 Momentum is building.";
  }else{
    momentum.textContent = "🏆 Team goal crushed. Keep going.";
  }

  rows.forEach((x)=>{
    const leader = top > 0 && x.bp === top;
    const d = document.createElement("div");
    d.className = "br" + (leader ? " lead1" : "");
    const rk = document.createElement("div");
    rk.className = "rk";
    if(top === 0){rk.textContent = "🎯";}
    else if(leader){rk.textContent = tied ? "🥇" : "👑";}
    else{rk.textContent = "🥈";}

    const mid = document.createElement("div");
    mid.className = "bn";
    mid.textContent = x.owner;

    const sm = document.createElement("small");
    if(top === 0){
      sm.textContent = "Waiting for the first BP";
    }else if(leader){
      if(tied){sm.textContent = "Tied for the lead";}
      else{
        const other = rows.find(r => r.owner !== x.owner);
        sm.textContent = "In the lead by " + (x.bp - (other?.bp || 0));
      }
    }else{
      sm.textContent = (top-x.bp) + " to catch up";
    }
    mid.appendChild(sm);

    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("i");
    fill.style.width = top > 0 ? Math.round((x.bp / top) * 100) + "%" : "0%";
    bar.appendChild(fill);

    const bv = document.createElement("div");
    bv.className = "bv";
    bv.textContent = x.bp;
    const s = document.createElement("small");
    s.textContent = "BPs";
    bv.appendChild(s);

    d.append(rk, mid, bv);
    board.appendChild(d);
  });

  if(top > 0 && tied){
    const t = document.createElement("div");
    t.className = "tie";
    t.textContent = "It’s a tie!";
    board.appendChild(t);
  }
}

function renderTabs(){
  $("tabs").innerHTML = "";
  TABS.forEach(owner => {
    const b = document.createElement("button");
    b.className = "tab" + (owner === tab ? " on" : "");
    b.innerHTML = owner + " <small>(" + ownerLeads(owner).length + ")</small>";
    b.onclick = () => { tab = owner; filter = "All"; try{localStorage.setItem("tab", owner);}catch(e){}; render(); };
    $("tabs").appendChild(b);
  });
}

function renderStats(){
  const set = ownerLeads(tab);
  const n = set.length;
  const countStatus = status => set.filter(l => l.status === status).length;
  const pct = (a,b) => b ? Math.round(100*a/b) + "%" : "—";
  const items = [
    [n, tab === "Pool" ? "Total leads" : "Leads", ""],
    [countStatus("Contacted") + " / " + n, "Contacted", pct(countStatus("Contacted"), n)],
    [countStatus("Interview") + " / " + n, "Interview", pct(countStatus("Interview"), n)],
    [countStatus("Hired") + " / " + n, "New BPs", pct(countStatus("Hired"), n)]
  ];

  $("stats").innerHTML = "";
  items.forEach(([value,label,meta]) => {
    const d = document.createElement("div");
    d.className = "stat";
    const b = document.createElement("b");
    b.textContent = value;
    const s = document.createElement("span");
    s.textContent = label + (meta ? " · " + meta : "");
    d.append(b,s);
    $("stats").appendChild(d);
  });
}

function renderFilters(){
  const set = ownerLeads(tab);
  const filters = [
    ["All","All",set.length],
    ["Contacted","Contacted",set.filter(l => l.status === "Contacted").length],
    ["Interview","Interview",set.filter(l => l.status === "Interview").length],
    ["New BPs","Hired",set.filter(l => l.status === "Hired").length],
    ["No Show","No Show",set.filter(l => l.status === "No Show").length],
  ];

  $("filters").innerHTML = "";
  filters.forEach(([label,key,count]) => {
    const b = document.createElement("button");
    b.className = "chip" + (key === filter ? " on" : "");
    b.textContent = label + " " + count;
    b.onclick = () => { filter = key; render(); };
    $("filters").appendChild(b);
  });
}

function renderLeads(){
  const poolBox = $("poolbox");
  poolBox.style.display = tab === "Pool" ? "block" : "none";

  const list = $("list");
  list.innerHTML = "";
  if(!db){
    list.innerHTML = '<div class="msg">Connect the shared database to load and save leads.</div>';
    return;
  }

  let shown = ownerLeads(tab);
  if(filter !== "All") shown = shown.filter(l => l.status === filter);
  shown = shown.slice().sort((a,b) => (b.created || 0) - (a.created || 0));

  if(!shown.length){
    list.innerHTML = '<div class="empty">No leads here yet.</div>';
    return;
  }

  shown.forEach(lead => renderLead(lead, list));
}

function renderLead(lead, list){
  const d = document.createElement("div");
  d.className = "lead";

  const top = document.createElement("div");
  top.className = "top";

  const left = document.createElement("div");
  const nm = document.createElement("div");
  nm.className = "nm";
  nm.textContent = lead.name || [lead.first, lead.last].filter(Boolean).join(" ") || "Unnamed";

  const ct = document.createElement("div");
  ct.className = "ct";
  ct.textContent = (lead.contact || []).filter(Boolean).join(" • ");
  left.append(nm, ct);

  const sel = document.createElement("select");
  STATUSES.forEach(status => {
    const option = document.createElement("option");
    option.value = status;
    option.textContent = status;
    if(status === lead.status){option.selected = true;}
    sel.appendChild(option);
  });
  sel.onchange = () => updateLead(lead.id, {status: sel.value});

  top.append(left, sel);

  const tags = document.createElement("div");
  tags.className = "tgs";
  addQuickButton(tags, "Contacted", lead.status === "Contacted", () => updateLead(lead.id,{status:"Contacted"}));
  addQuickButton(tags, "Interview", lead.status === "Interview", () => updateLead(lead.id,{status:"Interview"}));
  addQuickButton(tags, "No show", lead.status === "No Show", () => updateLead(lead.id,{status:"No Show"}), true);
  addQuickButton(tags, "New BP", isBP(lead), () => updateLead(lead.id,{status:isBP(lead) ? "New" : "Hired"}), false);

  const platform = document.createElement("select");
  platform.style.cssText = "padding:6px 10px;font-size:12px;border-radius:999px;";
  ["","LinkedIn","ZipRecruiter","Indeed","Other"].forEach(value => {
    const option = document.createElement("option");
    option.value = value;
    option.textContent = value || "Platform…";
    if(value === (lead.platform || "")){option.selected = true;}
    platform.appendChild(option);
  });
  platform.onchange = () => updateLead(lead.id,{platform:platform.value});
  tags.appendChild(platform);

  const notes = document.createElement("textarea");
  notes.placeholder = "Notes…";
  notes.value = lead.notes || "";
  notes.onchange = () => updateLead(lead.id,{notes:notes.value});

  const acts = document.createElement("div");
  acts.className = "acts";

  const moveButtons = lead.owner === "Pool" ? [
    ownerButton("Give to Logan", "Logan"),
    ownerButton("Give to Leo", "Leo")
  ] : [
    ownerButton("Move to " + (lead.owner === "Logan" ? "Leo" : "Logan"), lead.owner === "Logan" ? "Leo" : "Logan"),
    ownerButton("Back to pool", "Pool")
  ];

  moveButtons.forEach(btn => acts.appendChild(btn));

  const del = document.createElement("button");
  del.textContent = "Delete";
  del.onclick = async () => {
    if(!del.dataset.arm){
      del.dataset.arm = "1";
      del.textContent = "Tap again to delete";
      del.style.color = "#dc2626";
      setTimeout(()=>{del.dataset.arm=""; del.textContent = "Delete"; del.style.color = "";},4000);
      return;
    }
    try{
      const {error} = await sb.from("leads").delete().eq("id", lead.id);
      if(error) throw error;
      leads = leads.filter(x => String(x.id) !== String(lead.id));
      render();
      note("Deleted " + (lead.name || "lead"));
    }catch(e){fail(e);}
  };
  acts.appendChild(del);

  d.append(top, tags, notes, acts);
  list.appendChild(d);
}

function ownerButton(label, owner){
  const button = document.createElement("button");
  button.textContent = label;
  button.onclick = () => moveLead(lead.id, owner);
  return button;
}

function addQuickButton(parent, label, on, action, bad=false){
  const b = document.createElement("button");
  b.className = "tg" + (on ? " on" : "") + (bad ? " bad" : "");
  b.textContent = label;
  b.onclick = action;
  parent.appendChild(b);
}

function moveLead(id, newOwner){
  if(!sb){note("Database is not connected.",true); return;}
  const index = leads.findIndex(l => String(l.id) === String(id));
  if(index === -1) return;
  const lead = leads[index];
  const oldOwner = lead.owner;
  if(oldOwner === newOwner) return;
  leads[index] = {...lead, owner: newOwner};
  render();
  showMove("Moved " + (lead.name || "lead") + " → " + newOwner);
  try{
    const {error} = await sb.from("leads").update({owner:newOwner}).eq("id", id);
    if(error) throw error;
    note("Moved to " + newOwner + " ✨");
  }catch(e){
    leads[index] = {...lead, owner: oldOwner};
    render();
    fail(e);
  }
}

async function updateLead(id, patch){
  if(!sb){note("Database is not connected.",true); return;}
  const index = leads.findIndex(l => String(l.id) === String(id));
  if(index === -1) return;
  const oldLead = {...leads[index]};
  const becomingBP = patch.status === "Hired" && !isBP(oldLead);
  leads[index] = {...leads[index], ...patch};
  render();
  try{
    const {error} = await sb.from("leads").update(patch).eq("id", id);
    if(error) throw error;
    if(becomingBP){
      note("NEW BP! Leaderboard updated ✨");
    }else{note("Updated ✨");}
  }catch(e){
    leads[index] = oldLead;
    render();
    fail(e);
  }
}

async function init(){
  try{
    const {createClient} = window.supabase;
    sb = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {auth: {persistSession: false}});
    db = true;
    const {data, error} = await sb.from("leads").select("*");
    if(error) throw error;
    leads = data || [];
    render();
  }catch(e){
    db = false;
    render();
    note("Database is not connected.", true);
  }
}

window.addEventListener("DOMContentLoaded", init);

</script>
</body>
</html>
